{% extends "base.html" %}
{% block title %}Новий пароль{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Встановлення нового пароля</h2>
    <p style="font-size:13px; color:#495057;">
        Обліковий запис: <b>{{ user['username'] }}</b> (токен дійсний до {{ expires_at }})
    </p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <div class="form-group">
            <label for="password">Новий пароль</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Підтвердження пароля</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Зберегти пароль</button>
    </form>
</div>
{% endblock %}
