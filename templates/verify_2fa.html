{% extends "base.html" %}
{% block title %}Підтвердження 2FA{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Двофакторна автентифікація</h2>
    <p style="font-size:13px; color:#495057;">
        Користувач: <b>{{ user['username'] }}</b> (метод: {{ user['two_fa_method']|upper }})
    </p>

    <form method="POST" action="{{ url_for('auth.verify_2fa') }}">
        <div class="form-group">
            {% if user['two_fa_method'] == 'email' %}
                <label for="otp_code">Введіть 6-значний код, надісланий на {{ user['email'] }}</label>
            {% else %}
                <label for="otp_code">Введіть 6-значний код із додатка Google Authenticator</label>
            {% endif %}
            <input type="text" id="otp_code" name="otp_code" required maxlength="6" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Підтвердити</button>
    </form>
</div>
{% endblock %}
