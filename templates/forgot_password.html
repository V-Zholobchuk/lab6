{% extends "base.html" %}
{% block title %}Відновлення пароля{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Відновлення пароля</h2>
    <p style="font-size:13px; color:#495057;">
        Введіть email вашого облікового запису для отримання посилання зі скиданням пароля.
    </p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Надіслати посилання</button>
    </form>

    <div style="margin-top:14px; text-align:center; font-size:13px;">
        <a href="{{ url_for('auth.login') }}" style="color:#0d6efd;">Повернутися до входу</a>
    </div>
</div>
{% endblock %}
